name: Verify encrypted Hermes restore without starting a gateway
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare isolated verification
        run: |
          missing_packages=()
          for command in sqlite3 openssl; do
            if ! command -v "$command" >/dev/null 2>&1; then missing_packages+=("$command"); fi
          done
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then missing_packages+=(python3-yaml); fi
          if (( ${#missing_packages[@]} )); then
            sudo timeout --kill-after=10s 90s apt-get update
            sudo timeout --kill-after=10s 90s apt-get install -y "${missing_packages[@]}"
          fi
          python3 -m unittest discover -s tests -v
      - name: Restore and snapshot actual encrypted state in isolation
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          umask 077
          verification_root="$(mktemp -d "$RUNNER_TEMP/hermes-preflight.XXXXXX")"
          trap 'rm -rf "$verification_root"' EXIT
          python3 ops/state_store.py restore --read-only --work "$verification_root/state" --home "$verification_root/user"
          cp -rf overlay/.hermes/. "$verification_root/user/.hermes/"
          python3 ops/runtime_config.py --home "$verification_root/user/.hermes"
          python3 ops/state_store.py seal --work "$verification_root/state" --home "$verification_root/user"
          echo 'RESTORE_DRILL_OK inner_generation_verified=true production_refs_changed=false gateway_started=false model_called=false message_sent=false'
      - name: Verify real recovery artifact API with the synthetic CI fixture
        env:
          HERMES_BUNDLE_KEY: hermes-synthetic-smoke
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/state_recovery_drill.py verify --folder "$RUNNER_TEMP/hermes-state-smoke"
