name: Verify Hermes operational fixes
on:
  push:
    paths:
      - 'ops/**'
      - 'tests/**'
      - 'overlay/.hermes/ops/**'
      - 'overlay/.hermes/scripts/**'
      - '.github/workflows/**'
      - 'deploy/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            sudo timeout --kill-after=10s 90s apt-get update
            sudo timeout --kill-after=10s 90s apt-get install -y python3-yaml
          fi
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q ops overlay/.hermes/ops overlay/.hermes/scripts
          bash -n deploy/prepare-runtime.sh deploy/install-systemd.sh
          systemd-analyze --user verify deploy/hermes.service
      - name: Verify patches against the exact production core
        run: |
          core_archive="$RUNNER_TEMP/hermes-core.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 90 --retry 3 --retry-max-time 120 \
            https://codeload.github.com/NousResearch/hermes-agent/tar.gz/2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 -o "$core_archive"
          mkdir -p "$RUNNER_TEMP/hermes-core"
          tar -xzf "$core_archive" -C "$RUNNER_TEMP/hermes-core" --strip-components=1
          python3 ops/verify_core.py --core "$RUNNER_TEMP/hermes-core"
      - name: Seal synthetic recovery fixture
        env:
          HERMES_BUNDLE_KEY: hermes-synthetic-smoke
        run: python3 ops/state_recovery_drill.py create --folder "$RUNNER_TEMP/hermes-state-smoke"
      - name: Publish synthetic fixture for the isolated artifact API drill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-recovery-bundle-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hermes-state-smoke/publish/hermes-bundle.enc
            ${{ runner.temp }}/hermes-state-smoke/publish/hermes-bundle.meta.json
          retention-days: 1
          if-no-files-found: error
