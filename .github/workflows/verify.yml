name: Verify Hermes operational fixes
on:
  push:
    paths:
      - 'ops/**'
      - 'tests/**'
      - 'overlay/.hermes/ops/**'
      - 'overlay/.hermes/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q ops overlay/.hermes/ops overlay/.hermes/scripts
