name: Hermes 24x7 Cloud Gateway

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */5 * * *'

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: hermes-telegram-gateway
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main

      - name: Install pinned Hermes and dependencies
        run: |
          missing_packages=()
          for command in jq openssl sqlite3 curl; do
            if ! command -v "$command" >/dev/null 2>&1; then missing_packages+=("$command"); fi
          done
          if ! python3 -c 'import yaml' >/dev/null 2>&1; then missing_packages+=(python3-yaml); fi
          if (( ${#missing_packages[@]} )); then
            sudo timeout --kill-after=10s 90s apt-get update
            sudo timeout --kill-after=10s 90s apt-get install -y "${missing_packages[@]}"
          fi
          hermes_ref=2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          installer="$(mktemp)"
          curl -fsSL --retry 3 --proto '=https' "https://raw.githubusercontent.com/NousResearch/hermes-agent/${hermes_ref}/scripts/install.sh" -o "$installer"
          echo "abf338605dae6dd28d101673ac6aed7995c955745db46d47676bc591a7957209  $installer" | sha256sum -c -
          bash "$installer" --commit "$hermes_ref" --non-interactive
          rm -f "$installer"
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"
          npm install -g 9router@0.5.112
          if ! npm install -g @llmtrim/cli@0.13.4; then
            echo "::warning::Optional llmtrim install failed; gateway operation can continue"
          fi
          if ! uv tool install https://github.com/Panniantong/Agent-Reach/archive/47898829204ad27521d8a1719e3aeca3b8a3e0ca.zip; then
            echo "::warning::Optional Agent Reach install failed; built-in web tools remain available"
          fi
          python3 -m unittest discover -s tests -v

      - name: Restore encrypted state and apply verified operational fixes
        id: restore
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
        run: |
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -in hermes-bundle.enc -out /tmp/hermes-restore.tar.gz -pass env:HERMES_BUNDLE_KEY
          tar -xzf /tmp/hermes-restore.tar.gz -C "$HOME"
          rm -f /tmp/hermes-restore.tar.gz
          if [ -d overlay/.claude ]; then
            mkdir -p "$HOME/.claude"
            cp -rf overlay/.claude/. "$HOME/.claude/"
          fi
          cp -rf overlay/.hermes/. "$HOME/.hermes/"
          sed -i 's/\r$//' "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
          chmod +x "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
          if [ -d "$HOME/.hermes/skills/antigravity-laptop/cua" ]; then
            mkdir -p "$HOME/.cua"
            chmod 700 "$HOME/.cua"
            cp -f "$HOME/.hermes/skills/antigravity-laptop/cua/"* "$HOME/.cua/"
            chmod 600 "$HOME/.cua/"*
          fi
          test -s "$HOME/.hermes/.env"
          test -s "$HOME/.hermes/state.db"
          python3 ops/runtime_config.py --home "$HOME/.hermes"
          python3 ops/apply_core_patches.py --core "$HOME/.hermes/hermes-agent"
          python3 ops/state_bundle.py --home "$HOME" --output /tmp/hermes-restore-proof.tar.gz
          rm -f /tmp/hermes-restore-proof.tar.gz
          touch /tmp/hermes-restored-ok

      - name: Run gateway with bounded graceful shutdown
        id: gateway
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$HOME/.hermes/hermes-agent/.hermes/bin:$HOME/.hermes/node/bin:$(npm prefix -g)/bin:$PATH"
          9router --tray --skip-update -n -H 127.0.0.1 -p 20128 >/tmp/9router.log 2>&1 &
          router_pid=$!
          router_ready() {
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:20128/v1/models 2>/dev/null)" || return 1
            [[ "$status" == 200 || "$status" == 401 ]]
          }
          for i in $(seq 1 30); do
            if router_ready; then break; fi
            sleep 1
          done
          if ! router_ready; then
            echo "::error::9router transport is unavailable"
            exit 1
          fi
          timeout --signal=SIGTERM --kill-after=180s 19200s hermes gateway run &
          gateway_pid=$!
          deployed_sha="$(git rev-parse HEAD)"
          (
            while kill -0 "$gateway_pid" 2>/dev/null; do
              router_http=unreachable
              if router_ready; then router_http=ready; fi
              printf 'HERMES_HEARTBEAT %s gateway_process=running router_transport=%s inference=untested\n' "$(date -u +%FT%TZ)" "$router_http"
              if ! python3 ops/health_report.py --home "$HOME/.hermes"; then
                echo "::warning::Detailed health probe failed; process liveness is not full readiness"
              fi
              if ! python3 ops/publish_readiness.py --home "$HOME/.hermes" --sha "$deployed_sha"; then
                echo "::warning::Could not publish runtime readiness receipt"
              fi
              sleep 60
            done
          ) &
          heartbeat_pid=$!
          gateway_status=0
          wait "$gateway_pid" || gateway_status=$?
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          kill "$router_pid" 2>/dev/null || true
          echo "exit_code=$gateway_status" >> "$GITHUB_OUTPUT"
          printf 'HERMES_CYCLE_END %s exit=%s\n' "$(date -u +%FT%TZ)" "$gateway_status"
          if [[ "$gateway_status" != 0 && "$gateway_status" != 124 ]]; then
            echo "::error::Gateway exited unexpectedly; persistent state will still be saved"
            exit 1
          fi

      - name: Snapshot and publish encrypted state
        id: persist
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
        run: |
          umask 077
          test -f /tmp/hermes-restored-ok
          python3 ops/state_bundle.py --home "$HOME" --output /tmp/hermes-state.tar.gz
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/hermes-state.tar.gz -out /tmp/hermes-recovery.enc -pass env:HERMES_BUNDLE_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/hermes-recovery.enc -pass env:HERMES_BUNDLE_KEY | tar -tzf - >/dev/null
          test "$(stat -c %s /tmp/hermes-recovery.enc)" -lt 99614720
          cp /tmp/hermes-recovery.enc hermes-bundle.enc
          rm -f /tmp/hermes-state.tar.gz
          git config user.name hermes-bot
          git config user.email hermes-bot@users.noreply.github.com
          git add hermes-bundle.enc
          git commit -m "chore: persist verified Hermes state [skip ci]"
          git pull --rebase origin main
          git push

      - name: Retain encrypted recovery if publishing fails
        if: ${{ always() && steps.persist.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-encrypted-recovery-${{ github.run_id }}
          path: /tmp/hermes-recovery.enc
          retention-days: 2
          if-no-files-found: warn

      - name: Queue next cycle after successful persistence
        if: ${{ always() && steps.persist.outcome == 'success' && steps.gateway.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hermes.yml
