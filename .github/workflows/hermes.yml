name: Hermes 24x7 Cloud Gateway

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */5 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hermes-telegram-gateway
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A queued run needs the latest persisted state from the trusted branch.
          ref: main

      - name: Install Hermes Agent, 9router & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep jq openssl sqlite3 curl
          hermes_ref=2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 # v0.23.0
          installer="$(mktemp)"
          curl -fsSL --retry 3 --proto '=https' "https://raw.githubusercontent.com/NousResearch/hermes-agent/${hermes_ref}/scripts/install.sh" -o "$installer"
          echo "abf338605dae6dd28d101673ac6aed7995c955745db46d47676bc591a7957209  $installer" | sha256sum -c -
          bash "$installer" --commit "$hermes_ref" --non-interactive
          rm -f "$installer"
          export PATH="$HOME/.local/bin:$HOME/.hermes/node/bin:$PATH"
          npm install -g 9router@0.5.112 @llmtrim/cli@0.13.4 || npm install -g 9router@0.5.112
          uv tool install https://github.com/Panniantong/Agent-Reach/archive/47898829204ad27521d8a1719e3aeca3b8a3e0ca.zip || true

      - name: Restore Encrypted Hermes & 9router State
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in hermes-bundle.enc -out /tmp/hermes-bundle.tar.gz -pass env:HERMES_BUNDLE_KEY
          tar -xzf /tmp/hermes-bundle.tar.gz -C "$HOME"
          rm -f /tmp/hermes-bundle.tar.gz
          if [ -d "overlay/.claude" ]; then
            mkdir -p "$HOME/.claude"
            cp -rf overlay/.claude/* "$HOME/.claude/"
          fi
          if [ -d "overlay/.hermes" ]; then
            cp -rf overlay/.hermes/* "$HOME/.hermes/"
            sed -i 's/\r$//' "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
            chmod +x "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
          fi
          if [ -d "$HOME/.hermes/skills/antigravity-laptop/cua" ]; then
            mkdir -p "$HOME/.cua"
            chmod 700 "$HOME/.cua"
            cp -f "$HOME/.hermes/skills/antigravity-laptop/cua/"* "$HOME/.cua/" 2>/dev/null || true
            chmod 600 "$HOME/.cua/"* 2>/dev/null || true
          fi
          if [ ! -s "$HOME/.hermes/.env" ] || [ ! -s "$HOME/.hermes/state.db" ]; then
            echo "ERROR: Restored state is missing .hermes/.env or .hermes/state.db!"
            exit 1
          fi
          touch /tmp/.hermes_restored_ok
          if [ -f "$HOME/.hermes/state.db" ]; then
            sqlite3 "$HOME/.hermes/state.db" "DELETE FROM compression_locks; DELETE FROM session_turn_leases; DELETE FROM gateway_hygiene_state; PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi
          if [ -f "$HOME/.9router/db/data.sqlite" ]; then
            sqlite3 "$HOME/.9router/db/data.sqlite" "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi
          rm -f "$HOME/.hermes/cron/".*.lock "$HOME/.hermes/cron/"*.lock "$HOME/.hermes/cron/"*.pid "$HOME/.hermes/cron/catch_up_occurrences" 2>/dev/null || true
          rm -rf "$HOME/.hermes/cron/admissions/"* "$HOME/.hermes/cron/external-workers/"* 2>/dev/null || true
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$HOME/.hermes/hermes-agent/.hermes/bin:$HOME/.hermes/node/bin:$PATH"
          hermes config set terminal.backend local || true
          hermes config set platforms.telegram.extra.drop_pending_on_cold_boot false || true
          hermes config set auxiliary.compression.provider auto || true
          hermes config set mcp_servers.notion.enabled false || true
          python3 -c '
import yaml, json, pathlib, datetime
home = pathlib.Path.home()
p = home / ".hermes/config.yaml"
if p.exists():
    d = yaml.safe_load(p.read_text()) or {}
    d["fallback_providers"] = [
        {"provider": "custom", "model": "ag/gemini-3.8-flash", "base_url": "http://127.0.0.1:20128/v1"},
        {"provider": "custom", "model": "ag/gemini-3-flash", "base_url": "http://127.0.0.1:20128/v1"},
        {"provider": "groq", "model": "openai/gpt-oss-120b"},
    ]
    d.setdefault("auxiliary", {})["compression"] = {
        "provider": "auto",
        "timeout": 60,
        "fallback_chain": [
            {"provider": "custom", "model": "ag/gemini-3.8-flash", "base_url": "http://127.0.0.1:20128/v1", "timeout": 60},
            {"provider": "custom", "model": "ag/gemini-3-flash", "base_url": "http://127.0.0.1:20128/v1", "timeout": 60},
            {"provider": "custom", "model": "xai/grok-code-fast-1", "base_url": "http://127.0.0.1:20128/v1", "timeout": 60},
            {"provider": "groq", "model": "openai/gpt-oss-120b", "timeout": 60},
            {"provider": "openrouter", "model": "google/gemini-2.5-flash", "timeout": 60},
        ],
    }
    if isinstance(d.get("mcp_servers"), dict) and "notion" in d["mcp_servers"]:
        d["mcp_servers"]["notion"]["enabled"] = False
    p.write_text(yaml.safe_dump(d, sort_keys=False))

jf = home / ".hermes/cron/jobs.json"
if jf.exists():
    jdata = json.loads(jf.read_text())
    now_ts = datetime.datetime.now(datetime.timezone.utc).timestamp()
    for job in jdata.get("jobs", []):
        job["fire_claim"] = None
        rep = job.get("repeat") or {}
        sched = job.get("schedule") or {}
        is_oneshot = (rep.get("times") == 1) or (sched.get("kind") in ("once", "at"))
        if is_oneshot and (rep.get("completed", 0) >= 1):
            job["enabled"] = False
            job["state"] = "completed"
        nra = job.get("next_run_at")
        if nra and is_oneshot:
            try:
                if datetime.datetime.fromisoformat(nra).timestamp() < now_ts - 600:
                    job["enabled"] = False
                    job["state"] = "expired"
            except Exception:
                pass
    jf.write_text(json.dumps(jdata, indent=2, ensure_ascii=False))
' || true

      - name: Start 9router Token Balancer & Run Hermes Gateway (5h 20m cycle)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$HOME/.hermes/hermes-agent/.hermes/bin:$HOME/.hermes/node/bin:$(npm prefix -g)/bin:$PATH"
          nohup 9router --tray --skip-update -n -H 127.0.0.1 -p 20128 >/tmp/9router.log 2>&1 &
          router_ready() {
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:20128/v1/models 2>/dev/null)" || return 1
            [[ "$status" == 200 || "$status" == 401 ]]
          }
          for i in $(seq 1 30); do
            if router_ready; then break; fi
            sleep 1
          done
          if ! router_ready; then
            echo "::error::9router HTTP endpoint did not become ready"
            exit 1
          fi
          timeout --signal=SIGTERM 19200s hermes gateway run &
          gateway_pid=$!
          (
            while kill -0 "$gateway_pid" 2>/dev/null; do
              router_http=unreachable
              if router_ready; then router_http=ready; fi
              printf 'HERMES_HEARTBEAT %s gateway_process=running router_http=%s\n' "$(date -u +%FT%TZ)" "$router_http"
              sleep 30
            done
          ) &
          heartbeat_pid=$!
          gateway_status=0
          wait "$gateway_pid" || gateway_status=$?
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          printf 'HERMES_CYCLE_END %s exit=%s\n' "$(date -u +%FT%TZ)" "$gateway_status"
          if [[ "$gateway_status" != 124 ]]; then
            echo "::warning::Hermes gateway stopped before the cycle timed out"
          fi

      - name: Persist Updated State & Re-dispatch Next Cycle
        if: success()
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/.hermes_restored_ok ] || [ ! -s "$HOME/.hermes/.env" ]; then
            echo "CRITICAL: Hermes state was not restored; refusing to overwrite hermes-bundle.enc!"
            exit 1
          fi
          if [ -f "$HOME/.hermes/state.db" ]; then
            sqlite3 "$HOME/.hermes/state.db" "DELETE FROM compression_locks; DELETE FROM session_turn_leases; PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi
          if [ -f "$HOME/.9router/db/data.sqlite" ]; then
            sqlite3 "$HOME/.9router/db/data.sqlite" "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi
          tar -czf /tmp/hermes-bundle.tar.gz -C "$HOME" \
            .hermes/.env \
            .hermes/.copilot_jwt.json \
            .hermes/auth.json \
            .hermes/config.yaml \
            .hermes/SOUL.md \
            .hermes/bin \
            .hermes/cron/jobs.json \
            .hermes/memories \
            .hermes/skills \
            .hermes/state.db \
            .hermes/kanban.db \
            .hermes/shared-state.db \
            .hermes/channel_directory.json \
            .9router/db/data.sqlite \
            .9router/jwt-secret \
            .9router/machine-id \
            .9router/auth \
            .9router/model-catalog.json \
            .9router/model-catalog-raw.json \
            .cua/credentials.json \
            .cua/device-key \
            .cua/session.json 2>/dev/null || true
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/hermes-bundle.tar.gz -out hermes-bundle.enc -pass env:HERMES_BUNDLE_KEY
          rm -f /tmp/hermes-bundle.tar.gz
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add hermes-bundle.enc
          git commit -m "chore: sync encrypted hermes state [skip ci]" && (git pull --rebase origin main && git push) || true
          gh workflow run hermes.yml || true