name: Hermes 24x7 Cloud Gateway

on:
  workflow_dispatch:
    inputs:
      verify_delivery:
        description: 'Run one model probe and send the owner a Telegram recovery test'
        type: boolean
        default: false
  schedule:
    - cron: '25 */5 * * *'

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: hermes-telegram-gateway
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main

      - name: Install pinned Hermes and dependencies
        timeout-minutes: 30
        run: |
          bash deploy/prepare-runtime.sh
          python3 -m unittest discover -s tests -v

      - name: Restore encrypted state and apply verified operational fixes
        id: restore
        timeout-minutes: 10
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          python3 ops/state_store.py restore --work "$RUNNER_TEMP/hermes-state" --home "$HOME"
          if [ -d overlay/.claude ]; then
            mkdir -p "$HOME/.claude"
            cp -rf overlay/.claude/. "$HOME/.claude/"
          fi
          cp -rf overlay/.hermes/. "$HOME/.hermes/"
          sed -i 's/\r$//' "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
          chmod +x "$HOME/.hermes/bin/"* "$HOME/.hermes/skills/antigravity-laptop/bin/"* "$HOME/.hermes/skills/codex-laptop/bin/"* 2>/dev/null || true
          if [ -d "$HOME/.hermes/skills/antigravity-laptop/cua" ]; then
            mkdir -p "$HOME/.cua"
            chmod 700 "$HOME/.cua"
            cp -f "$HOME/.hermes/skills/antigravity-laptop/cua/"* "$HOME/.cua/"
            chmod 600 "$HOME/.cua/"*
          fi
          test -s "$HOME/.hermes/.env"
          test -s "$HOME/.hermes/state.db"
          python3 ops/runtime_config.py --home "$HOME/.hermes"
          python3 ops/apply_core_patches.py --core "$HOME/.hermes/hermes-agent"
          python3 ops/state_bundle.py --home "$HOME" --output /tmp/hermes-restore-proof.tar.gz
          rm -f /tmp/hermes-restore-proof.tar.gz
          touch /tmp/hermes-restored-ok

      - name: Run gateway with active progress supervision
        id: gateway
        timeout-minutes: 295
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_DELIVERY: ${{ inputs.verify_delivery || false }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$HOME/.hermes/node/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python3 ops/supervise.py --max-runtime 17400

      - name: Snapshot and seal next encrypted state generation
        id: persist
        timeout-minutes: 10
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          HERMES_BUNDLE_KEY: ${{ secrets.HERMES_BUNDLE_KEY }}
        run: |
          umask 077
          test -f /tmp/hermes-restored-ok
          python3 ops/state_store.py seal --work "$RUNNER_TEMP/hermes-state" --home "$HOME"

      - name: Retain encrypted recovery before publishing state refs
        id: recovery
        timeout-minutes: 3
        if: ${{ always() && steps.persist.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-recovery-bundle-${{ steps.persist.outputs.state_seq }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hermes-state/publish/hermes-bundle.enc
            ${{ runner.temp }}/hermes-state/publish/hermes-bundle.meta.json
          retention-days: 5
          if-no-files-found: error

      - name: Publish parentless state commit and rotate backup refs atomically
        id: publish
        timeout-minutes: 5
        if: ${{ always() && steps.recovery.outcome == 'success' }}
        run: python3 ops/state_store.py publish --work "$RUNNER_TEMP/hermes-state"

      - name: Remove this recovery artifact only after confirmed state publication
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! timeout --kill-after=5s 45s gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.recovery.outputs.artifact-id }}"; then
            echo '::warning::Published recovery artifact retained until its five-day expiry'
          fi
      - name: Queue next cycle after successful persistence
        if: ${{ always() && steps.publish.outcome == 'success' && steps.gateway.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout --kill-after=5s 45s gh workflow run hermes.yml
